name: Fix iOS app startup

on:
  push:
    paths:
      - '.github/workflows/fix-ios-startup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make cache cleanup non-blocking
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'async function start() {\n  await cleanupOldAppCaches();\n'
          new = 'async function start() {\n  cleanupOldAppCaches();\n'
          if old not in s:
              raise SystemExit('Expected startup code not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix iOS startup blocking on cache cleanup'
          git push
