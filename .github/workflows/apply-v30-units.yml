name: Apply v30 optional units

on:
  push:
    paths:
      - '.github/workflows/apply-v30-units.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply unit changes directly to working app
        shell: bash
        run: |
          cp index.html index_v29_stable_startfix.html
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          def rep(a,b,label):
              global s
              if a not in s:
                  raise SystemExit(f'Missing pattern: {label}')
              s=s.replace(a,b,1)

          rep('''      <label for="editProductDefaultUnit">Standard-Masseinheit</label>\n      <select id="editProductDefaultUnit"></select>\n      <div class="small-muted">Diese Einheit wird beim Hinzufügen vorgeschlagen und kann jedes Mal geändert werden.</div>\n\n''','', 'edit product default unit html')
          rep('''          <label for="quantityUnit">Masseinheit</label>\n          <select id="quantityUnit"></select>''','''          <label for="quantityUnit">Masseinheit <span class="small-muted">(optional)</span></label>\n          <input id="quantityUnit" type="text" list="unitOptionsList" autocomplete="off" placeholder="optional" />''','quantity unit')
          rep('''      <div class="small-muted">Die vorgeschlagene Einheit kannst du für diesen Einkauf anpassen.</div>''','''      <div class="small-muted">Einheit aus der Liste auswählen oder eine eigene Einheit eingeben. Das Feld darf leer bleiben.</div>''','quantity hint')
          rep('''          <label>Menge und vorgeschlagene Masseinheit</label>''','''          <label>Menge und Masseinheit <span class="small-muted">(optional)</span></label>''','new product unit label')
          rep('''              <label for="newProductDefaultUnit">Masseinheit</label>\n              <select id="newProductDefaultUnit"></select>''','''              <label for="newProductDefaultUnit">Masseinheit</label>\n              <input id="newProductDefaultUnit" type="text" list="unitOptionsList" autocomplete="off" placeholder="optional" />''','new product unit')
          rep('''          <div class="small-muted">Die App schlägt eine Einheit vor. Du kannst sie hier anpassen. Sie wird zugleich als Standard für dieses Produkt gespeichert.</div>''','''          <div class="small-muted">Einheit aus der Liste auswählen oder frei eingeben. Menge und Masseinheit dürfen beide leer bleiben.</div>''','new product unit hint')
          rep('''  <dialog id="newProductDialog">''','''  <datalist id="unitOptionsList">\n    <option value="Stück"></option>\n    <option value="g"></option>\n    <option value="kg"></option>\n    <option value="ml"></option>\n    <option value="l"></option>\n    <option value="Packung"></option>\n    <option value="Beutel"></option>\n    <option value="Flasche"></option>\n    <option value="Dose"></option>\n    <option value="Glas"></option>\n    <option value="Rolle"></option>\n    <option value="Tube"></option>\n    <option value="Schachtel"></option>\n    <option value="Bund"></option>\n    <option value="Paar"></option>\n  </datalist>\n\n  <dialog id="newProductDialog">''','unit datalist')

          a=s.index('function fillUnitSelect('); b=s.index('\n\nfunction parseQuantity',a)
          s=s[:a]+'''function fillUnitSelect(input, selected = "") {\n  if (!input) return;\n  input.value = String(selected ?? "").trim();\n}'''+s[b:]
          a=s.index('function quantityLabel('); b=s.index('\n\nfunction suggestDefaultUnit',a)
          s=s[:a]+'''function quantityLabel(quantity, unit = "") {\n  const formatted = formatQuantity(quantity);\n  const cleanUnit = String(unit || "").trim();\n  if (formatted && cleanUnit) return `${formatted} ${cleanUnit}`;\n  if (formatted) return formatted;\n  return cleanUnit;\n}\n\nfunction quantityChipLabel(quantity, unit = "") {\n  return quantityLabel(quantity, unit) || "Menge";\n}'''+s[b:]

          rep('''  fillUnitSelect($("quantityUnit"), editItem?.unit || productDefaultUnit(product));''','''  fillUnitSelect($("quantityUnit"), editItem ? (editItem.unit || "") : "");''','blank unit on new list item')
          rep('''  const unit = $("quantityUnit").value;''','''  const unit = $("quantityUnit").value.trim();''','trim edited unit')
          rep('''  $("newProductSubgroupName").addEventListener("input", () => { updateSuggestedNewProductUnit(); updateNewProductSaveState(); });\n  $("newProductDefaultUnit").addEventListener("change", () => { newProductUnitTouched = true; });''','''  $("newProductSubgroupName").addEventListener("input", updateNewProductSaveState);''','new product listeners')
          rep('''    subgroup: p.subcategory,\n    defaultUnit: productDefaultUnit(p),\n    imagePath: p.image_path || "",''','''    subgroup: p.subcategory,\n    imagePath: p.image_path || "",''','catalog no default')
          rep('''    `<button class="product-btn" data-name="${escapeAttr(p.name)}" data-category="${escapeAttr(p.category)}" data-subgroup="${escapeAttr(p.subgroup)}" data-unit="${escapeAttr(p.defaultUnit)}">''','''    `<button class="product-btn" data-name="${escapeAttr(p.name)}" data-category="${escapeAttr(p.category)}" data-subgroup="${escapeAttr(p.subgroup)}">''','product button no unit')
          rep('''        ${q ? `<span class="product-btn-meta">${escapeHtml(p.category)} · ${escapeHtml(p.subgroup)} · Standard: ${escapeHtml(p.defaultUnit)}</span>` : ""}''','''        ${q ? `<span class="product-btn-meta">${escapeHtml(p.category)} · ${escapeHtml(p.subgroup)}</span>` : ""}''','product search meta')
          rep('''    subgroup: b.dataset.subgroup,\n    defaultUnit: b.dataset.unit || "Stück"''','''    subgroup: b.dataset.subgroup''','product click')
          rep('''  newProductUnitTouched = false;\n  $("newProductNameLabel").textContent = cleanName;\n  $("newProductQuantity").value = "";\n  fillUnitSelect($("newProductDefaultUnit"), suggestDefaultUnit(cleanName));''','''  $("newProductNameLabel").textContent = cleanName;\n  $("newProductQuantity").value = "";\n  fillUnitSelect($("newProductDefaultUnit"), "");''','new product blank unit')
          a=s.index('function updateSuggestedNewProductUnit()'); b=s.index('\n\nfunction selectedNewProductCategory',a)
          s=s[:a]+s[b+2:]
          s=s.replace('  updateSuggestedNewProductUnit();\n','')
          rep('''  const unit = $("quantityUnit").value;\n  if (Number.isNaN(quantity)) return toast("Bitte eine gültige Menge grösser als 0 eingeben oder das Feld leer lassen");\n\n  const product = pendingQuantityProduct;''','''  const unit = $("quantityUnit").value.trim();\n  if (Number.isNaN(quantity)) return toast("Bitte eine gültige Menge grösser als 0 eingeben oder das Feld leer lassen");\n\n  const product = pendingQuantityProduct;''','trim new item unit')
          rep('''  const quantity = parseQuantity($("newProductQuantity").value);\n  const defaultUnit = $("newProductDefaultUnit").value;''','''  const quantity = parseQuantity($("newProductQuantity").value);\n  const unit = $("newProductDefaultUnit").value.trim();''','new product entered unit')
          rep('''  const savedProduct = await saveCatalogProduct(name, category, subgroup, defaultUnit);''','''  const savedProduct = await saveCatalogProduct(name, category, subgroup);''','catalog save without unit')
          rep('''  await addItem(name, category, subgroup, quantity, defaultUnit);''','''  await addItem(name, category, subgroup, quantity, unit);''','add new product unit')
          rep('''async function saveCatalogProduct(name, category, subgroup, defaultUnit = "Stück") {''','''async function saveCatalogProduct(name, category, subgroup) {''','catalog signature')
          rep('''    default_unit: UNIT_OPTIONS.includes(defaultUnit) ? defaultUnit : "Stück",''','''    default_unit: "",''','catalog empty unit')
          rep('''async function addItem(name, category, subgroup, quantity = null, unit = "Stück") {''','''async function addItem(name, category, subgroup, quantity = null, unit = "") {''','add item empty unit')
          rep('''    toast(`${name} · ${quantityLabel(quantity, unit)} hinzugefügt`);''','''    { const detail = quantityLabel(quantity, unit); toast(detail ? `${name} · ${detail} hinzugefügt` : `${name} hinzugefügt`); }''','weekly toast')
          rep('''  toast(`${name} · ${quantityLabel(quantity, unit)} hinzugefügt`);''','''  { const detail = quantityLabel(quantity, unit); toast(detail ? `${name} · ${detail} hinzugefügt` : `${name} hinzugefügt`); }''','shared toast')
          s=s.replace('${escapeHtml(quantityLabel(i.quantity, i.unit || "Stück"))}','${escapeHtml(quantityChipLabel(i.quantity, i.unit || ""))}')
          rep('''      subgroup: item.subcategory,\n      defaultUnit: item.unit || "Stück"''','''      subgroup: item.subcategory''','edit list item no default')
          rep('''          <span>${escapeHtml(p.category)} · ${escapeHtml(p.subcategory)} · Standard: ${escapeHtml(productDefaultUnit(p))}</span>''','''          <span>${escapeHtml(p.category)} · ${escapeHtml(p.subcategory)}</span>''','admin meta')
          rep('''  fillEditProductSubgroups(product.category, product.subcategory);\n  fillUnitSelect($("editProductDefaultUnit"), productDefaultUnit(product));''','''  fillEditProductSubgroups(product.category, product.subcategory);''','edit product no unit')
          rep('''  const subgroup = $("editProductSubgroup").value;\n  const defaultUnit = $("editProductDefaultUnit").value;\n\n  if (!name || !category || !subgroup || !defaultUnit) return toast("Alle Felder ausfüllen");''','''  const subgroup = $("editProductSubgroup").value;\n\n  if (!name || !category || !subgroup) return toast("Name, Kategorie und Untergruppe ausfüllen");''','edit product validation')
          rep('''      product_name: name,\n      category,\n      subcategory: subgroup,\n      default_unit: defaultUnit''','''      product_name: name,\n      category,\n      subcategory: subgroup''','edit product update')
          s=s.replace('let newProductUnitTouched = false;\n','')
          s=s.replace('GEMEINSAM EINKAUFEN · V28','GEMEINSAM EINKAUFEN · V30')
          p.write_text(s)
          Path('index_v30.html').write_text(s)
          PY
      - name: Validate JavaScript and required behaviour
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          assert 'id="quantityUnit" type="text" list="unitOptionsList"' in s
          assert 'id="newProductDefaultUnit" type="text" list="unitOptionsList"' in s
          assert 'fillUnitSelect($("quantityUnit"), editItem ? (editItem.unit || "") : "");' in s
          assert 'default_unit: ""' in s
          assert 'Standard-Masseinheit' not in s
          assert ' · Standard:' not in s
          assert 'cleanupOldAppCaches();' in s
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s)
          Path('/tmp/app.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/app.js
      - name: Commit v30
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html index_v30.html index_v29_stable_startfix.html
          git commit -m 'Apply v30 optional free units directly' || exit 0
          git push
