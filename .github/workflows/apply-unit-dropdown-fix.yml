name: Apply unit dropdown fix
on:
  push:
    paths:
      - '.github/scripts/fix_unit_dropdown.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 .github/scripts/fix_unit_dropdown.py
      - name: Validate app JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text()
          Path('/tmp/app.js').write_text('\n'.join(re.findall(r'<script>(.*?)</script>', s, re.S)))
          PY
          node --check /tmp/app.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix v30 unit dropdown on iPhone"
          git push
